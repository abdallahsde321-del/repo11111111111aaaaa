name: Continuous 24/7 VPS Runner 1

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (FFmpeg, Node.js, Deno, yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip install -U yt-dlp

      - name: Connect to Tailscale with SSH
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      - name: Keep Alive Loop (4 Hours)
        run: |
          echo "VPS 1 is active!"
          sleep 14400
