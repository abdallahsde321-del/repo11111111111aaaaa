name: Run Video Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# نسخة واحدة فقط شغالة، ونسخة واحدة في الانتظار. لا نلغي النسخة الشغالة أبدًا.
concurrency:
  group: video-bot-worker
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip check

      - name: Start YouTube PO Token provider
        continue-on-error: true
        shell: bash
        run: |
          docker run --pull=always -d \
            --name bgutil-provider \
            --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO Token provider is ready."
              exit 0
            fi
            sleep 1
          done

          echo "::warning::PO Token provider did not become ready; continuing without it."
          docker logs bgutil-provider || true
          exit 1

      - name: Verify tools
        run: |
          python --version
          yt-dlp --version
          python -m pip show bgutil-ytdlp-pot-provider
          ffmpeg -version | head -n 1
          deno --version | head -n 1
          curl -fsS http://127.0.0.1:4416/ping || true

      - name: Mark worker start time
        run: echo "WORKER_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run bot
        id: bot
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COOKIES_CONTENT: ${{ secrets.COOKIES_CONTENT }}
          PYTHONUNBUFFERED: "1"
        run: python -u bot_alpha.py

      # يعيد التشغيل فقط لو البوت اشتغل 10 دقائق على الأقل،
      # عشان أي خطأ فوري (مثل توكن غلط) ما يعمل حلقة تشغيل لا نهائية.
      - name: Start next worker
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          elapsed=$(( $(date +%s) - WORKER_STARTED ))
          if [ "$elapsed" -lt 600 ]; then
            echo "::warning::Bot stopped after ${elapsed}s; not re-dispatching to avoid a crash loop."
            exit 0
          fi
          gh workflow run run_alpha.yml --ref "${GITHUB_REF_NAME}"

      - name: Fail the run if the bot crashed
        if: ${{ steps.bot.outcome == 'failure' }}
        run: |
          echo "::error::bot_alpha.py exited with an error. Check the 'Run bot' step logs."
          exit 1
